name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-*.txt
      # No PyTorch here: the suite uses the offline embedder, so CI stays fast and needs no model download.
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - name: Retrieval regression gate (offline embedder)
        run: python -m evaluation.run_eval --embedding-model hashing --min-recall-at-5 0.9

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t rag-api .
