services:
  api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      # Mount your own documents here; the index rebuilds automatically when they change.
      - ./data:/app/data:ro
      # Persist the FAISS index between restarts.
      - index:/app/index
      # Documents added through the API.
      - uploads:/app/uploads
    environment:
      CORS_ORIGINS: "http://localhost:5173"

volumes:
  index:
  uploads:
